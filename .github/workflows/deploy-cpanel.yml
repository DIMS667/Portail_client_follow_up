name: Deploy website and client portal to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpanel-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run typecheck

      - name: Build website and client portal
        run: npm run build:production

      - name: Verify production and SEO package
        run: npm run seo:check

      - name: Verify cPanel configuration
        env:
          FTP_SERVER: ${{ secrets.CPANEL_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.CPANEL_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.CPANEL_FTP_PASSWORD }}
        run: |
          test -n "$FTP_SERVER" || { echo "Missing secret: CPANEL_FTP_SERVER"; exit 1; }
          test -n "$FTP_USERNAME" || { echo "Missing secret: CPANEL_FTP_USERNAME"; exit 1; }
          test -n "$FTP_PASSWORD" || { echo "Missing secret: CPANEL_FTP_PASSWORD"; exit 1; }

      - name: Deploy website and portal to public_html over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          protocol: ${{ vars.CPANEL_FTP_PROTOCOL || 'ftps' }}
          port: ${{ vars.CPANEL_FTP_PORT || '21' }}
          local-dir: dist/
          server-dir: /
          state-name: .followup-deploy-sync-state-v2.json
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .well-known/**
            api/**
            cgi-bin/**
            .user.ini
            php.ini
          log-level: minimal
          dangerous-clean-slate: false

      - name: Verify live website and client portal
        run: |
          root_html="$(curl --fail --silent --show-error --retry 5 --retry-delay 3 "https://followupassurance.com/?deployment=${{ github.sha }}")"
          login_html="$(curl --fail --silent --show-error --retry 5 --retry-delay 3 "https://followupassurance.com/login/?deployment=${{ github.sha }}")"
          portal_html="$(curl --fail --silent --show-error --retry 5 --retry-delay 3 "https://followupassurance.com/portail-client/?deployment=${{ github.sha }}")"
          caution_html="$(curl --fail --silent --show-error --retry 5 --retry-delay 3 "https://followupassurance.com/solutions/caution/?deployment=${{ github.sha }}")"
          robots_txt="$(curl --fail --silent --show-error --retry 5 --retry-delay 3 "https://followupassurance.com/robots.txt?deployment=${{ github.sha }}")"
          sitemap_xml="$(curl --fail --silent --show-error --retry 5 --retry-delay 3 "https://followupassurance.com/sitemap.xml?deployment=${{ github.sha }}")"
          echo "$root_html" | grep -q 'src="/assets/' || { echo "The public website is not served at /"; exit 1; }
          echo "$login_html" | grep -q 'src="/assets/' || { echo "The login page is not served at /login/"; exit 1; }
          echo "$portal_html" | grep -q 'src="/portail-client/assets/' || { echo "The client portal is not served at /portail-client/"; exit 1; }
          echo "$root_html" | grep -q 'rel="canonical" href="https://followupassurance.com/"' || { echo "The public canonical tag is missing"; exit 1; }
          echo "$caution_html" | grep -q 'rel="canonical" href="https://followupassurance.com/solutions/caution/"' || { echo "The caution page was not pre-rendered"; exit 1; }
          echo "$login_html" | grep -q 'name="robots" content="noindex, nofollow, noarchive"' || { echo "The login noindex tag is missing"; exit 1; }
          echo "$robots_txt" | grep -q 'Sitemap: https://followupassurance.com/sitemap.xml' || { echo "robots.txt is invalid"; exit 1; }
          echo "$sitemap_xml" | grep -q '<loc>https://followupassurance.com/solutions/caution/</loc>' || { echo "sitemap.xml is incomplete"; exit 1; }

          not_found_status="$(curl --silent --output /dev/null --write-out '%{http_code}' "https://followupassurance.com/verification-page-absente-${{ github.sha }}")"
          moto_status="$(curl --silent --output /dev/null --write-out '%{http_code}' "https://followupassurance.com/solutions/moto")"
          login_headers="$(curl --silent --show-error --head "https://followupassurance.com/login/")"
          portal_headers="$(curl --silent --show-error --head "https://followupassurance.com/portail-client/")"
          test "$not_found_status" = "404" || { echo "Unknown public URLs do not return HTTP 404"; exit 1; }
          test "$moto_status" = "301" || { echo "The legacy motorcycle URL is not permanently redirected"; exit 1; }
          echo "$login_headers" | grep -qi 'x-robots-tag: noindex, nofollow, noarchive' || { echo "The login X-Robots-Tag is missing"; exit 1; }
          echo "$portal_headers" | grep -qi 'x-robots-tag: noindex, nofollow, noarchive' || { echo "The portal X-Robots-Tag is missing"; exit 1; }
