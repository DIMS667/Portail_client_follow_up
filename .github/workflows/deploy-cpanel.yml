name: Deploy website and client portal to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpanel-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run typecheck

      - name: Build website and client portal
        run: npm run build:production

      - name: Verify production package
        run: |
          test -f dist/index.html || { echo "Missing website index"; exit 1; }
          test -f dist/portail-client/index.html || { echo "Missing client portal index"; exit 1; }

      - name: Verify cPanel configuration
        env:
          FTP_SERVER: ${{ secrets.CPANEL_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.CPANEL_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.CPANEL_FTP_PASSWORD }}
        run: |
          test -n "$FTP_SERVER" || { echo "Missing secret: CPANEL_FTP_SERVER"; exit 1; }
          test -n "$FTP_USERNAME" || { echo "Missing secret: CPANEL_FTP_USERNAME"; exit 1; }
          test -n "$FTP_PASSWORD" || { echo "Missing secret: CPANEL_FTP_PASSWORD"; exit 1; }

      - name: Deploy website and portal to public_html over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          protocol: ${{ vars.CPANEL_FTP_PROTOCOL || 'ftps' }}
          port: ${{ vars.CPANEL_FTP_PORT || '21' }}
          local-dir: dist/
          server-dir: /
          state-name: .followup-deploy-sync-state-v2.json
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .well-known/**
            api/**
            cgi-bin/**
            .user.ini
            php.ini
          log-level: minimal
          dangerous-clean-slate: false

      - name: Verify live website and client portal
        run: |
          root_html="$(curl --fail --silent --show-error --retry 5 --retry-delay 3 "https://followupassurance.com/?deployment=${{ github.sha }}")"
          login_html="$(curl --fail --silent --show-error --retry 5 --retry-delay 3 "https://followupassurance.com/login/?deployment=${{ github.sha }}")"
          portal_html="$(curl --fail --silent --show-error --retry 5 --retry-delay 3 "https://followupassurance.com/portail-client/?deployment=${{ github.sha }}")"
          echo "$root_html" | grep -q 'src="/assets/' || { echo "The public website is not served at /"; exit 1; }
          echo "$login_html" | grep -q 'src="/assets/' || { echo "The login page is not served at /login/"; exit 1; }
          echo "$portal_html" | grep -q 'src="/portail-client/assets/' || { echo "The client portal is not served at /portail-client/"; exit 1; }
